[pytest]
# Пути для импорта
pythonpath = .

# Путь к тестам
testpaths = tests

# Шаблоны для поиска тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Опции запуска
addopts = 
    -v
    --tb=short
    --strict-markers
    --maxfail=1
    -W ignore::DeprecationWarning

# Маркеры
markers =
    smoke: Быстрые тесты для проверки основных функций
    slow: Медленные тесты
    integration: Интеграционные тесты
    unit: Модульные тесты

# Покрытие
[coverage:run]
source = app
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:для проверки основных функций